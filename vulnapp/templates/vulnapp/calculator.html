{% extends "vulnapp/base.html" %}
{% block content %}
<h1>Vulnerable Calculator (eval)</h1>

<form method="get">
  <label for="expression">Expression:</label>
  <input type="text" id="expression" name="expression" value="{{ expression }}" autofocus>
  <button type="submit">Evaluate</button>
</form>

{% if result is not None %}
  <div class="result">Result: {{ result }}</div>
{% endif %}
{% if error %}
  <div class="error">Error: {{ error }}</div>
{% endif %}



<p>Compare with the <a href="{% url 'safe_calculator' %}">fixed version</a></p>
{% endblock %}
